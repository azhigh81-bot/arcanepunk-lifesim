name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # manual trigger

env:
  UNITY_VERSION: 2022.3.22f1
  PROJECT_PATH: .

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library (speeds up subsequent builds)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Setup Unity
      - name: Setup Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ runner.os }}

      # 4. Activate Unity (needs UNITY_LICENSE secret in repo settings)
      - name: Activate Unity
        uses: game-ci/unity-activate@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      # 5. Build Android APK
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildMethod: Arcanepunk.Editor.BuildScript.PerformAndroidBuild
          projectPath: ${{ env.PROJECT_PATH }}
          customParameters: -quit -batchmode -nographics

      # 6. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcanepunk-APK
          path: build/Android/*.apk
          retention-days: 30

      # 7. Create release on tag push
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/Android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}